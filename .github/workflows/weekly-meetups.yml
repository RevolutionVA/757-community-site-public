name: Generate Weekly Meetups

on:
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  generate-weekly-meetups:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper date calculations

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Setup Yarn
        run: npm install -g yarn
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Run weekly meetups script
        run: node scripts/generate-weekly-meetups.js
      
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add weekly-meetups/
          git commit -m "Generate weekly meetups for $(date +%Y-%m-%d)"
          git push

      # Draft only — review, verify links, and send from the Bento dashboard.
      # Each run adds another draft, so a manual re-run means deleting the duplicate.
      - name: Create Bento newsletter draft
        env:
          BENTO_PUBLISHABLE_KEY: ${{ secrets.BENTO_PUBLISHABLE_KEY }}
          BENTO_SECRET_KEY: ${{ secrets.BENTO_SECRET_KEY }}
          BENTO_SITE_UUID: ${{ secrets.BENTO_SITE_UUID }}
          BENTO_FROM_EMAIL: newsletter@revolutionva.org
          BENTO_FROM_NAME: 757tech
          BENTO_SEGMENT_ID: '33230'
        run: node scripts/create-bento-broadcast.js